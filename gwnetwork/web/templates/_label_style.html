<style>
:root{
  --ground:#f4f7f8; --surface:#fff; --surface-2:#eef3f5;
  --ink:#111a1f; --ink-2:#3d4f58; --muted:#63757e;
  --line:#d8e3e7; --line-2:#c2d2d8;
  --accent:#0b6e82; --accent-soft:#0b6e8215; --accent-ink:#064c5a;
  --amber:#8a5200; --amber-soft:#8a520014; --hit:#ffe08a;
  --ok:#2f7d3a;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0b1215; --surface:#121c20; --surface-2:#17242a;
  --ink:#e4edf0; --ink-2:#b4c6cd; --muted:#8497a0;
  --line:#22333a; --line-2:#2e434c;
  --accent:#3fc4dc; --accent-soft:#3fc4dc1a; --accent-ink:#7fdcee;
  --amber:#f0b429; --amber-soft:#f0b4291a; --hit:#6b5410;
  --ok:#6fcf7f;
}}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 64px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}.small{font-size:.85rem}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;
  border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:18px;font-size:.92rem}
header .bar{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:120px}
header .bar i{display:block;height:100%;background:var(--accent)}
h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:18px 0 8px;font-weight:600}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.73rem;
  padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);
  margin:0 4px 4px 0}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip.done{border-color:var(--ok);color:var(--ok)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.36rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wrapx{overflow-x:auto}
</style>
