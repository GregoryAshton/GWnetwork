<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}GWnetwork{% endblock %}</title>
<style>
:root{
  --ground:#f4f7f8; --surface:#fff; --surface-2:#eef3f5;
  --ink:#111a1f; --ink-2:#3d4f58; --muted:#63757e;
  --line:#d8e3e7; --line-2:#c2d2d8;
  --accent:#0b6e82; --accent-soft:#0b6e8215; --accent-ink:#064c5a;
  --amber:#8a5200; --amber-soft:#8a520014;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0b1215; --surface:#121c20; --surface-2:#17242a;
  --ink:#e4edf0; --ink-2:#b4c6cd; --muted:#8497a0;
  --line:#22333a; --line-2:#2e434c;
  --accent:#3fc4dc; --accent-soft:#3fc4dc1a; --accent-ink:#7fdcee;
  --amber:#f0b429; --amber-soft:#f0b4291a;
}}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 64px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}
nav{border-bottom:1px solid var(--line);margin-bottom:22px;padding:16px 0;font-size:.92rem}
nav a{margin-right:16px}
h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.02rem;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:20px 0 8px;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.85rem}
table{border-collapse:collapse;width:100%;margin:.4rem 0}
th,td{text-align:left;padding:.42rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.wrapx{overflow-x:auto}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.73rem;
  padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);
  margin:0 4px 4px 0}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.note{margin:14px 0;padding:11px 13px;border-left:3px solid var(--amber);
  background:var(--amber-soft);border-radius:0 7px 7px 0;font-size:.86rem;color:var(--ink-2)}
blockquote{margin:.35rem 0;padding:.3rem .7rem;border-left:3px solid var(--line);
  color:var(--muted);font-size:.87rem}
form.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin-bottom:16px;display:grid;gap:12px}
@media(min-width:720px){form.filters{grid-template-columns:repeat(4,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:.9rem;padding:7px 9px;background:var(--ground);
  color:var(--ink);border:1px solid var(--line-2);border-radius:7px;min-width:0;width:100%}
.range{display:flex;gap:6px;align-items:center}
.actions{display:flex;gap:8px;align-items:flex-end}
button{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:7px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff}
button.ghost{background:none;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
@media(min-width:620px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:var(--surface);padding:11px 13px}
.stat b{display:block;font-size:1.25rem;font-weight:600}
.stat span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.07em;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
<nav><a href="/">GWnetwork</a><a href="/events">Events</a><a href="/papers">Papers</a></nav>
{% block content %}{% endblock %}
</div>
</body>
</html>
