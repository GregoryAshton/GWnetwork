# IAS-O1: every event the catalogue counts as a detection by its own criterion
# (transcribed in data/catalogues/IAS-O1.json; paper arXiv:1902.10341, arXiv:1902.10331).
#
# Criterion (Sec. II 'The new event', 1902.10331):
#   Our best estimate for the probability that this event is of astrophysical origin yields $P_{\rm astro} \approx 0.7$, which is above the bar of $0.5$ for listing events in the catalog of confident gravitational-wave detections defined in \cite{LIGOScientific:2018mvr}. [...] We therefore adopt the name \CANDIDATE for this event.
#
# Records on events with an LVK record were merged by GPS time, a human
# decision recorded under parameters.merge (DESIGN.md §4). catalogue_* fields
# are as the paper reports them, kept out of the event view's p_astro/far.

- common_name: GW151226
  source: ias
  catalog: IAS-O1
  external_id: IAS-O1:GW151226
  gps: 1135136350.585
  reference: arXiv:1902.10341, arXiv:1902.10331
  parameters:
    catalogue_p_astro: 1.0
    catalogue_p_astro_reported: 1.0
    catalogue_ifar_reported: '> 20000 O1 (upper limit on FAR of 1/(20000 O1), per-bank; ''O1'' ~ 46 days)'
    catalogue_tier: main
    catalogue_table: Table III (label tab:signalsFound, 'Events and subthreshold candidates in all of
      the binary black hole banks'), 1902.10341
    paper_says_new: false
    catalogue_names:
    - GW151226
    gps_source: GPS column of Table III (tab:signalsFound), 1902.10341; per table footnote these are 'linear-free'
      times of the best-fit template (1904.07214 adds that for the heavier BBH banks the linear-free time
      is 'practically close to the merger time')
    merge:
      event: GW151226
      basis: GPS time, -0.01 s from the LVK record
      decided_by: Gregory Ashton
      decided: '2026-11-12'
  designations:
  - designation: GW151226
    kind: gw_name
    precedence: 10
