# IAS-O2: every event the catalogue counts as a detection by its own criterion
# (transcribed in data/catalogues/IAS-O2.json; paper arXiv:1904.07214, arXiv:1910.09528).
#
# Criterion (Sec. II 'Preview of results' (first sentence) and Sec. V 'Overview of the newly discovered BBH mergers' (second); Table II caption: 'New events with astrophysical probability $> 50\%$', 1904.07214):
#   Also consistent with this is the fact that we find six new events with (a) false alarm rates below the threshold of 1 in 30 days defined in GWTC-1 (even after applying appropriate trials factors), and (b) probabilities of astrophysical origin $p_{\rm astro} > 0.5$, as effectively quantified by their consistency with the rates of occurrence of louder events. || The criterion in Table~\ref{tab:signalsFound} is based on the value of $p_{\rm astro}$, but all the events have significantly higher values of the `per-bank' IFAR than the threshold of 1 in 30 days, or $\sim 0.25$ O2, adopted in GWTC-1 \
#
# Records on events with an LVK record were merged by GPS time, a human
# decision recorded under parameters.merge (DESIGN.md §4). catalogue_* fields
# are as the paper reports them, kept out of the event view's p_astro/far.

