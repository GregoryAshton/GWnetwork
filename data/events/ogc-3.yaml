# Criterion (Sec. 5 Observational Results (opening paragraph); same threshold in the Table 2 caption: "Gravitational-wave observations from the full search of O1-O3a data with $\mathcal{P}_{\textrm{astro}} > 0.5$ or IFAR $>$ 100 years.", 2105.09151):
#   From the combined analysis of the 2015-2019 public LIGO and Virgo data, we find 55 BBH mergers and 2 BNS mergers. The list of gravitational wave mergers is given in Table~\ref{table:search}. For the majority of BBHs we can assess the probability of astrophysical origin. Our catalog includes candidates where $\mathcal{P}_{\textrm{astro}} > 0.5$ or $\mathrm{IFAR} > 100$ years. These thresholds are consistent with prior community conventions
#
