[project]
name = "gwnetwork"
version = "0.1.0"
description = "Map gravitational-wave events to the literature that uses them"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.9",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "anthropic>=0.40",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]

[project.scripts]
gwn = "gwnetwork.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gwnetwork*"]
